# Publishes via changesets, which is what the root `release` script uses and what
# .changeset/config.json is set up for.
#
# Started by hand, never by a push: publishing to npm can't be taken back, so it is a
# decision, not a side effect of merging. Run it from the Actions tab, or with
# `gh workflow run release.yml`. It needs an NPM_TOKEN secret whose token is allowed to
# publish without a one-time password (a granular token with 2FA bypass).

name: Release

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm run test

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run changeset -- version
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
